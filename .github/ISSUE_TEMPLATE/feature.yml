name: Feature
description: Feature mit Referenz zum WDF-Plan
title: "F-XXX: "
body:
  - type: input
    id: plan
    attributes:
      label: Feature-Plan
      placeholder: "plans/F-001-slug.md"
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User Story und Scope
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      value: "- [ ] AC-01: ..."
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risiken und Abhängigkeiten

  - type: input
    id: human_owner
    attributes:
      label: Human Feature Owner
      placeholder: "@github-handle"
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Geplanter Reviewer (Team/Factory)
      description: Bei Solo kann "nicht erforderlich" eingetragen werden.
      placeholder: "@github-handle oder nicht erforderlich"
    validations:
      required: true
